- test: ibex_trap_irq_instr
  description: Inject interrupt stimulus across supported instruction classes.
  iterations: 25
  gen_test: riscv_rand_instr_test
  gen_opts: >
    +instr_cnt=6000
    +require_signature_addr=1
    +enable_interrupt=1
    +enable_timer_irq=1
    +randomize_csr=1
    +no_csr_instr=0
    +no_ebreak=1
    +no_fence=0
    +directed_instr_0=riscv_load_store_rand_instr_stream,40
    +directed_instr_1=riscv_load_store_hazard_instr_stream,40
  rtl_test: ibex_trap_irq_instr_test
  sim_opts: >
    +require_signature_addr=1
    +enable_irq_single_seq=1
  compare_opts:
    compare_final_value_only: 1

- test: ibex_trap_irq_csr

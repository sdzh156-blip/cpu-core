# Appended into the pinned Ibex RISCV-DV extension testlist by bootstrap_ibex.py.

- test: ibex_trap_smoke
  description: >
    Short trap-subsystem bring-up with random CSR activity, illegal instructions and a single IRQ.
  iterations: 3
  gen_test: riscv_rand_instr_test
  gen_opts: >
    +instr_cnt=1500
    +require_signature_addr=1
    +enable_interrupt=1
    +enable_timer_irq=1
    +randomize_csr=1
    +illegal_instr_ratio=5
  rtl_test: ibex_trap_smoke_test
  sim_opts: >
    +require_signature_addr=1
    +enable_irq_single_seq=1
  compare_opts:
    compare_final_value_only: 1

- test: ibex_trap_illegal
  description: Illegal instruction trap and recovery with trap checker enabled.
  iterations: 15
  gen_test: riscv_rand_instr_test
  gen_opts: >
    +illegal_instr_ratio=25
  rtl_test: ibex_trap_exception_test

- test: ibex_trap_mem_fault
  description: Instruction fetch and data load/store error injection.
  iterations: 15
  gen_test: riscv_rand_instr_test
  gen_opts: >
    +require_signature_addr=1
    +instr_cnt=10000
    +randomize_csr=1
    +gen_all_csrs_by_default=1
    +add_csr_write=MSTATUS,MEPC,MCAUSE,MTVAL,0x7c0,0x7c1
    +enable_unaligned_load_store=1
    +suppress_pmp_setup=1
    +disable_pmp_exception_handler=1
  rtl_test: ibex_trap_mem_fault_test
  sim_opts: >
    +enable_mem_intg_err=0
    +enable_double_fault_detector=0
    +require_signature_addr=1
    +enable_bad_intg_on_uninit_access=0
  compare_opts:
    compare_final_value_only: 1

